services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      WL_DATABASE_URL: postgresql+asyncpg://wl:wl@db:5432/wl
      WL_REDIS_URL: redis://redis:6379/0
      WL_CACHE_BACKEND: redis
      WL_POLL_INTERVAL_SECONDS: ${WL_POLL_INTERVAL_SECONDS:-30}
      WL_WATCHED_STATIONS: ${WL_WATCHED_STATIONS:-Karlsplatz,Stephansplatz,Praterstern,Schwedenplatz}
      WL_LOG_JSON: "true"
    volumes:
      # Persist downloaded registry CSVs across container rebuilds.
      - registry-data:/srv/app/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: wl
      POSTGRES_PASSWORD: wl
      POSTGRES_DB: wl
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wl -d wl"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  registry-data:
